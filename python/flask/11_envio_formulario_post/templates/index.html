<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
    <div class="contenedor-principal mt-5">
        <div class="fila-centro justify-content-center">
            <div class="columna-formulario">
                <div class="tarjeta-usuario shadow">
                    <div class="encabezado-usuario bg-primary text-white">
                        <h3 class="titulo-formulario text-center">
                            <i class="bi bi-person-plus-fill"></i> Crear Usuario
                        </h3>
                    </div>

                    <div class="contenido-formulario">
                        <form action="{{ url_for('crear_usuario') }}" method="POST">

                            <div class="campo-formulario mb-3">
                                <label class="etiqueta-campo form-label">Nombre</label>
                                <input type="text" name="nombre" class="entrada-datos form-control"
                                    placeholder="Ingrese su nombre" required>
                            </div>

                            <div class="campo-formulario mb-3">
                                <label class="etiqueta-campo form-label">Correo Electrónico</label>
                                <input type="email" name="email" class="entrada-datos form-control"
                                    placeholder="correo@ejemplo.com" required>
                            </div>

                            <div class="campo-formulario mb-3">
                                <label class="etiqueta-campo form-label">Edad</label>
                                <input type="number" name="age" class="entrada-datos form-control"
                                    placeholder="Ingrese su edad" required>
                            </div>

                            <div class="campo-formulario mb-3">
                                <label class="etiqueta-campo form-label">Ciudad</label>
                                <input type="text" name="ciudad" class="entrada-datos form-control"
                                    placeholder="Ingrese su ciudad" required>
                            </div>

                            <button type="submit" class="boton-crear btn-success w-100">
                                <i class="bi bi-send-fill"></i> Crear Usuario
                            </button>

                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
