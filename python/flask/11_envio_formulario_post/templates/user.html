<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuario Registrado</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
    <div class="zona-principal mt-5">
        <div class="fila-centrada justify-content-center">
            <div class="espacio-formulario">
                <div class="tarjeta-resultado shadow">

                    <div class="cabecera-resultado bg-success text-white">
                        <h2 class="titulo-resultado text-center">
                            <i class="bi bi-check-circle-fill"></i> Usuario registrado correctamente
                        </h2>
                    </div>

                    <div class="contenido-resultado">
                        <p class="mensaje-principal lead">
                            El servidor recibió correctamente la información enviada desde el formulario.
                        </p>

                        <hr>

                        <p><strong>Nombre:</strong> {{ nombre }}</p>
                        <p><strong>Correo electrónico:</strong> {{ email }}</p>
                        <p><strong>Edad:</strong> {{ age }}</p>
                        <p><strong>Ciudad:</strong> {{ ciudad }}</p>

                        <hr>

                        <div class="boton-regreso d-grid">
                            <a href="{{ url_for('index') }}" class="enlace-formulario btn btn-primary">
                                <i class="bi bi-arrow-left-circle-fill"></i> Volver al formulario
                            </a>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
