<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
    <div class="container py-5">
        {# Navegación rápida #}
        <div class="mb-4 col-12 col-md-6 mx-auto">
            <a href="{{ url_for('usuarios') }}" class="btn btn-secondary btn-sm">← Volver a la lista</a>
        </div>

        {# Formulario para crear usuario #}
        <form action="{{ url_for('crear') }}" method="POST"
            class="p-4 col-12 col-md-6 mx-auto border rounded shadow-sm bg-white">

            <h2 class="text-center text-primary mb-4">Crear nuevo usuario</h2>

            {# Nombre #}
            <div class="mb-3">
                <label for="nombre" class="form-label">Nombre:</label>
                <input type="text" name="nombre" id="nombre" class="form-control" placeholder="Ej. Carlos" required>
            </div>

            {# Apellido #}
            <div class="mb-3">
                <label for="apellido" class="form-label">Apellido:</label>
                <input type="text" name="apellido" id="apellido" class="form-control" placeholder="Ej. Mendoza" required>
            </div>

            {# E-mail #}
            <div class="mb-4">
                <label for="email" class="form-label">E-mail:</label>
                <input type="email" name="email" id="email" class="form-control" placeholder="ejemplo@correo.com" required>
            </div>

            {# Botones de acción #}
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">Guardar usuario</button>
                <a href="{{ url_for('usuarios') }}" class="btn btn-outline-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</body>

</html>
