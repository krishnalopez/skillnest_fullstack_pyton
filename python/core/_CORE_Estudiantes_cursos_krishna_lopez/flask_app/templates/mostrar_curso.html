<!-- templates/mostrar_curso.html -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mostrar Curso</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f4f4; padding: 20px; font-family: Arial, sans-serif; }
        .contenedor { background: white; border: 2px solid #ccc; padding: 20px; max-width: 700px; margin: auto; }
    </style>
</head>
<body>
    <div class="contenedor">
        <h3 class="mb-4">Estudiantes de {{ curso.nombre }}</h3>
        
        <table class="table table-bordered border-dark text-center">
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Apellido</th>
                    <th>Edad</th>
                </tr>
            </thead>
            <tbody>
                {% if estudiantes %}
                    {% for est in estudiantes %}
                    <tr>
                        <td>{{ est.nombre }}</td>
                        <td>{{ est.apellido }}</td>
                        <td>{{ est.edad }}</td>
                    </tr>
                    {% endfor %}
                {% else %}
                    <tr>
                        <td colspan="3">No hay estudiantes en este curso todavía.</td>
                    </tr>
                {% endif %}
            </tbody>
        </table>
        
        <div class="mt-4">
            <a href="/cursos" style="color: blue; text-decoration: underline;">Inicio</a>
        </div>
    </div>
</body>
</html>
