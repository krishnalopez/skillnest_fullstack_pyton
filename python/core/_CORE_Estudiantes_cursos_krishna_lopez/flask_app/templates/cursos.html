<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cursos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f4f4; padding: 20px; font-family: Arial, sans-serif; }
        .contenedor { background: white; border: 2px solid #ccc; padding: 20px; max-width: 800px; margin: auto; }
        .columna { border: 1px solid #ccc; padding: 15px; }
        a { text-decoration: underline; color: blue; }
    </style>
</head>
<body>
    <div class="contenedor">
        <div class="row">
            <!-- Nuevo Curso -->
            <div class="col-md-6 columna">
                <h3 class="text-center">Nuevo Curso</h3>
                <form action="/cursos/crear" method="POST" class="d-flex align-items-center justify-content-center mt-4">
                    <label class="me-2">Nombre:</label>
                    <input type="text" name="nombre" class="form-control form-control-sm w-50 border-dark" required>
                    <button type="submit" class="btn btn-outline-dark btn-sm ms-2">Crear</button>
                </form>
            </div>
            
            <!-- Todos los Cursos -->
            <div class="col-md-6 columna">
                <h3 class="text-center">Todos los Cursos</h3>
                <ul class="list-unstyled text-center mt-4">
                    {% for curso in cursos %}
                        <li class="mb-2">
                            <a href="/cursos/{{ curso.id }}">{{ curso.nombre }}</a>
                        </li>
                    {% endfor %}
                </ul>
                <div class="text-center mt-4">
                    <a href="/estudiante">Agregar Estudiante</a>
                </div>
            </div>
        </div>
        <div class="text-center mt-4">
            <a href="/cursos">Inicio</a>
        </div>
    </div>
</body>
</html>
