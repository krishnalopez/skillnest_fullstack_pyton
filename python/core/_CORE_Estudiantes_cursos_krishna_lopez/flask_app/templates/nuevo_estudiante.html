<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Nuevo Estudiante</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f4f4; padding: 20px; font-family: Arial, sans-serif; }
        .contenedor { background: white; border: 2px solid #ccc; padding: 20px; max-width: 500px; margin: auto; }
        .nota { background-color: #ffebcd; border: 1px solid #e0c090; padding: 10px; font-size: 12px; max-width: 150px; margin-left: auto; margin-bottom: 10px;}
    </style>
</head>
<body>
    <div class="contenedor">
        <div class="d-flex justify-content-end">
            <div class="nota text-center">
                El campo Curso debe ser un select con todos los cursos en la base de datos.
            </div>
        </div>
        
        <h3 class="text-center mb-4">Nuevo Estudiante</h3>
        
        <form action="/estudiante/crear" method="POST">
            <div class="row mb-2 align-items-center">
                <div class="col-3"><label>Curso:</label></div>
                <div class="col-9">
                    <select name="curso_id" class="form-select form-select-sm border-dark" required>
                        <option value="">Seleccione...</option>
                        {% for curso in cursos %}
                            <option value="{{ curso.id }}">{{ curso.nombre }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            <div class="row mb-2 align-items-center">
                <div class="col-3"><label>Nombre:</label></div>
                <div class="col-9"><input type="text" name="nombre" class="form-control form-control-sm border-dark" required></div>
            </div>
            <div class="row mb-2 align-items-center">
                <div class="col-3"><label>Apellido:</label></div>
                <div class="col-9"><input type="text" name="apellido" class="form-control form-control-sm border-dark" required></div>
            </div>
            <div class="row mb-3 align-items-center">
                <div class="col-3"><label>Edad:</label></div>
                <div class="col-9"><input type="number" name="edad" class="form-control form-control-sm border-dark" required></div>
            </div>
            <div class="row">
                <div class="col-3"></div>
                <div class="col-9">
                    <button type="submit" class="btn btn-outline-dark btn-sm px-4">Crear</button>
                </div>
            </div>
        </form>
        
        <div class="mt-4">
            <a href="/cursos" style="color: blue; text-decoration: underline;">Inicio</a>
        </div>
    </div>
</body>
</html>
