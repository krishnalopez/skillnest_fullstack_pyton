<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Inicio</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="bg-light min-vh-100 d-flex align-items-center">
    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6 text-center">
                <div class="card border-0 shadow-sm p-4 p-md-5 rounded-4 bg-white">
                    <h1 class="display-5 fw-bold text-primary mb-3">¡Bienvenido, {{ usuario.nombre }}!</h1>
                    <p class="lead text-secondary">Has iniciado sesión correctamente en el sistema.</p>
                    
                    <hr class="my-4 border-secondary opacity-25">
                    
                    <div class="d-grid gap-2 d-sm-flex justify-content-sm-center">
                        <a href="{{ url_for('logout') }}" class="btn btn-outline-danger px-4 py-2 fw-semibold">
                            Cerrar Sesión
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>

</html>
