<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="bg-light d-flex align-items-center min-vh-100 py-5">
    <main class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-5">
                <div class="card border-0 shadow-sm p-4">
                    <h2 class="text-center fw-bold mb-4">Inicio de Sesión</h2>

                    <!-- Alertas de error procesadas por Flash -->
                    {% with messages = get_flashed_messages(category_filter=['login']) %}
                        {% if messages %}
                            {% for msg in messages %}
                                <div class="alert alert-danger py-2 small" role="alert">
                                    {{ msg }}
                                </div>
                            {% endfor %}
                        {% endif %}
                    {% endwith %}

                    <!-- Formulario de Login -->
                    <form action="{{ url_for('login') }}" method="POST">
                        <div class="mb-3">
                            <label for="email" class="form-label">Correo Electrónico</label>
                            <input type="email" id="email" name="email" class="form-control" placeholder="correo@ejemplo.com" required autocomplete="email">
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label">Contraseña</label>
                            <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2">Ingresar</button>
                    </form>

                    <div class="text-center mt-4">
                        <span class="text-muted small">¿No tienes una cuenta?</span>
                        <a href="{{ url_for('mostrar_registro') }}" class="text-decoration-none small fw-semibold">Regístrate aquí</a>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>

</html>
